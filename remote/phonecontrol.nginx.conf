# nginx on the server: phonecontrol7312.mitch.pro -> the rice-remote tunnel on 127.0.0.1:10394
# Install (as root):  certbot certonly --nginx -d phonecontrol7312.mitch.pro
#                     cp phonecontrol.nginx.conf /etc/nginx/conf.d/phonecontrol.conf && nginx -t && systemctl reload nginx
# sign-in tries per client address, before they reach the laptop (rice-remote has its own lockout too)
limit_req_zone $binary_remote_addr zone=riceremote_login:1m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name phonecontrol7312.mitch.pro;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # port 443 is the SNI stream router, which forwards here with the PROXY protocol
    listen 8443 ssl;
    http2 on;
    server_name phonecontrol7312.mitch.pro;

    ssl_certificate /etc/letsencrypt/live/phonecontrol7312.mitch.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phonecontrol7312.mitch.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # the real client address (from the PROXY header), for rice-remote's login lockouts
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header proxy_protocol;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 32k;

    location ~ ^/(login|api/passkey/login(-options)?)$ {
        limit_req zone=riceremote_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:10394;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
    }

    location / {
        proxy_pass http://127.0.0.1:10394;
        proxy_set_header Host $host;
        # set, not appended: the client cannot forge its own address
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
    }
}
