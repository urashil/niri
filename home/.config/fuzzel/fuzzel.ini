include=~/.config/fuzzel/colors.ini

[main]
font=JetBrainsMono Nerd Font:size=12
prompt="   "
icon-theme=Papirus-Dark
terminal=kitty
width=44
lines=10
horizontal-pad=24
vertical-pad=18
inner-pad=10
line-height=26
letter-spacing=0
anchor=center
layer=overlay
fields=filename,name,generic
show-actions=no

[border]
width=2
radius=16
selection-radius=10

[dmenu]
exit-immediately-if-empty=yes
