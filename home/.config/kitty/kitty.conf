font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
disable_ligatures never
modify_font      cell_height 105%

cursor_shape            beam
cursor_beam_thickness   1.6
cursor_blink_interval   0
cursor_trail            3
cursor_trail_decay      0.1 0.4

scrollback_lines        20000
mouse_hide_wait         2.0
copy_on_select          clipboard
strip_trailing_spaces   smart
url_style               curly
detect_urls             yes

window_padding_width    14 18
window_margin_width     0
confirm_os_window_close 0
enable_audio_bell       no
remember_window_size    no
initial_window_width    120c
initial_window_height   34c
hide_window_decorations yes
wayland_titlebar_color  background
shell                   zsh

tab_bar_style           powerline
tab_powerline_style     round
tab_bar_edge            bottom
tab_bar_min_tabs        2
tab_title_template      " {index} {title} "

allow_remote_control    socket-only
listen_on               unix:/tmp/kitty-{kitty_pid}
shell_integration       enabled

enabled_layouts         splits,stack
map alt+backslash       launch --location=vsplit --cwd=current
map alt+minus           launch --location=hsplit --cwd=current
map alt+left            neighboring_window left
map alt+right           neighboring_window right
map alt+up              neighboring_window up
map alt+down            neighboring_window down
map alt+z               toggle_layout stack
map ctrl+shift+right    next_tab
map ctrl+shift+left     previous_tab
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

include colors.conf
